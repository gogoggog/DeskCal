# 'v'로 시작하는 태그를 올리면 윈도우용 설치 파일을 만들어 Releases에 올립니다.
name: Windows 빌드와 배포

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          name: DeskCal ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 받기
            - **DeskCal-Setup.exe** — 설치 프로그램 (추천). 더블클릭하면 설치되고 바탕화면에 바로가기가 생깁니다.
            - **DeskCal-Windows.zip** — 설치 없이 압축만 풀어서 쓰는 버전

            처음 실행할 때 파란 'Windows의 PC 보호' 창이 뜨면 '추가 정보' → '실행'을 누르세요.
          files: |
            dist/DeskCal-Setup.exe
            dist/DeskCal-Windows.zip
