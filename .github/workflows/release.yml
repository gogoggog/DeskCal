# 프로그램 코드가 main에 올라오면 윈도우용 설치 파일을 만들어 Releases에 올립니다.
# 버전 번호는 package.json의 version을 따릅니다 (예: 0.5.1 → v0.5.1).
name: Windows 빌드와 배포

on:
  push:
    branches: [main]
    paths: ['src/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: 구글 등록 값 넣기 (GitHub 비밀 칸에서)
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "const fs=require('fs');const f='src/google-client.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.client_secret=process.env.GOOGLE_CLIENT_SECRET||'';if(!j.client_secret){console.error('GOOGLE_CLIENT_SECRET 비밀 값이 없습니다');process.exit(1)}fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - run: npx electron-builder --win --x64 --publish never
      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          name: DeskCal ${{ steps.ver.outputs.tag }}
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            ## 받기
            - **DeskCal-Setup.exe** — 설치 프로그램 (추천). 더블클릭하면 설치되고 바탕화면에 바로가기가 생깁니다.
            - **DeskCal-Windows.zip** — 설치 없이 압축만 풀어서 쓰는 버전

            처음 실행할 때 파란 'Windows의 PC 보호' 창이 뜨면 '추가 정보' → '실행'을 누르세요.
          files: |
            dist/DeskCal-Setup.exe
            dist/DeskCal-Windows.zip
